<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Tabela Mecânicos</title>
    </head>
    <body>
        <table border="1">
            <tr>
                <th colspan="5" style="background-color: rgb(17, 246, 170);">Tabela de Serviços Mecânicos</th>

            <tr>
                <td rowspan="5" style="background-color: rgb(30, 79, 114);">Nacionais</td>
                <th style="background-color: rgb(164, 164, 164);">Veículos</th>
                <th style="background-color: rgb(164, 164, 164);">Serviço</th>

                <th style="background-color: rgb(164, 164, 164);;">Valor</th>
            </tr>

            <tr>
                <th>Caminhonete S10</th>
                <th>Suspensão</th>
                <th>3 horas e 25 minutos</th>
                <th>350,00</th>
            </tr>

            <tr>
                <th>Caminhonete Ranger</th>
                <th>Freio</th>
                <th>3 horas e 45 minutos</th>
                <th>200,00</th>
            </tr>

            <tr>
                <th>Caminhonete Hilux</th>
                <th>Troca de Bateria</th>
                <th>30 minutos</th>
                <th>25,00</th>
            </tr>

            <tr>
                <th>Caminhonete D10</th>
                <th>Alinhamento</th>
                <th>1 hora e 40 minutos</th>
                <th>220,00</th>
            </tr>
        </table>
    </body>
</html>
